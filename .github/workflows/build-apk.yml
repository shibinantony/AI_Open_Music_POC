name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v2.0.0-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v2.0.0-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0
          name: "JSABMusic v2.0.0 (Pure Native Media3 Player & 320kbps Direct CDN)"
          body: |
            ### 🎵 JSABMusic v2.0.0 — Pure Native Media3 Audio Player for JioSaavn
            **Engineered for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🏛️ Architectural Transformation in v2.0.0:
            - 🚀 **100% Pure Native Android Architecture:** Replaced the fragile WebView wrapper with a high-performance native Android application powered by **Jetpack Compose UI** and **AndroidX Media3 (ExoPlayer)**.
            - 🛡️ **Guaranteed 0% Advertisements:** Connects directly to Akamai/Cloudflare CDNs (`saavncdn.com`). Songs are streamed pure and unadulterated without touching any ad networks or tracking SDKs.
            - ⚡ **Pristine 320 kbps High-Fidelity Audio:** Implemented hardware DES decryption (`DES/ECB/PKCS5Padding`) to unlock uncompressed 320 kbps AAC/MP4 streams directly.
            - 🎚️ **Samsung Audio HAL DSP Equalizer:** Hardware 5-Band Equalizer and Sub-Bass Booster (+10 dB) attached directly to the native `audioSessionId` with 8 studio presets.
            - ♾️ **Zero Playback Blocks or App Walls:** No web limits, no timeouts, no "Listen with no limits on the JioSaavn App" stoppages.
            - ⏱️ **Seamless Continuous Playback & Gapless Transitions:** Powered by ExoPlayer playlist queue orchestration.
            - 🌙 **Persistent Screen-Off Background Engine:** Android 14/15/16 compliant `MediaSessionService` with lock-screen notification and system media controls.

            #### 📥 Download & Install:
            Download **`JSABMusic-v2.0.0-release.apk`** below, tap to install, and enjoy uninterrupted, studio-grade JioSaavn audio!
          files: |
            dist/JSABMusic-v2.0.0-release.apk
            dist/JSABMusic-v2.0.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
