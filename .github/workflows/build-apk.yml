name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v1.0.1-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v1.0.1-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "JSABMusic v1.0.1 (Unlimited Playback & Refined Dark UI)"
          body: |
            ### 🎵 JSABMusic v1.0.1 — AI-Governed Shielded Audio Player for JioSaavn
            **Optimized for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 Crucial Fixes & Upgrades in v1.0.1:
            - ♾️ **Eliminated "Listen with no limits on the JioSaavn App" Wall:** Spoofs modern desktop browser capabilities and runs a pre-DOM App-Wall annihilator, preventing JioSaavn from ever locking playback or halting music.
            - 🎨 **Refined High-Contrast AMOLED Dark UI:** Fixed confusing clashing colors and inverted text. Song titles are now crisp `#FFFFFF`, artist bylines are muted `#9E9E9E`, and buttons have high, pleasant contrast.
            - 🎛️ **Non-Intrusive Top-Right Action Pill:** Moved Equalizer and Sleep Timer buttons to an elegant, translucent top-right pill, completely clearing the bottom player bar and navigation controls.
            - 🛡️ **Zero Ads & Audio-Ad Fast-Forward:** Complete background shielding against JioAds, audio ads, and subscription popups.
            - 📱 **True Screen-Off Background Play:** Persistent background audio via `BackgroundWebView` visibility decoupling.

            #### 📥 Download & Install:
            Download **`JSABMusic-v1.0.1-release.apk`** below, tap to install, and enjoy continuous unlimited JioSaavn music!
          files: |
            dist/JSABMusic-v1.0.1-release.apk
            dist/JSABMusic-v1.0.1-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
