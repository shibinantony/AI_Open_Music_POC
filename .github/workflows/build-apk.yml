name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v3.0.1-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v3.0.1-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.0.1
          name: "JSABMusic v3.0.1 — Instant Launch, ANR Fix & Samsung Lockscreen Widget"
          body: |
            ### 🎵 JSABMusic v3.0.1 — Enjoy the Beauty of Sovereign Music
            **Hardened & Optimized for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 What's Fixed & Improved in v3.0.1:
            - 🛡️ **Zero Startup ANR (Application Not Responding):** Eliminated startup service freeze by decoupling idle service initialization from strict foreground timing rules. AndroidX Media3 manages foreground elevation on audio start with zero watchdog violations.
            - 📱 **Guaranteed Lock Screen & AOD Widget:** Upgraded notification channel to `IMPORTANCE_DEFAULT` with `VISIBILITY_PUBLIC` and explicit `POST_NOTIFICATIONS` runtime handling. Interactive media controls (Play/Pause, Next Track, Previous Track, Seekbar, and real-time album artwork) display reliably on Samsung One UI and Android 16 lockscreens.
            - ⚡ **Instant Zero-Latency Launch & Language Hub:** Replaced blocking API calls on app startup and language switching with an instant curated feed (0ms delay) and lightweight parallel background refreshers. Zero blank screens or loading spinners.
            - 🎧 **Continuous Background Playback:** Protected by CPU WakeLocks, Wi-Fi high-performance locks, and `START_STICKY` service recovery to keep music playing seamlessly even when the screen is turned off.
            - 🌐 **Multi-Language Explore Hub:** Instant switching across **English**, **Malayalam**, **Tamil**, **Hindi**, **Kannada**, **International**, and **Others**.
            - 🔍 **Fuzzy & Direct Music Search:** Fast search across Songs, Albums, Artists, and Playlists.
            - ☁️ **Full Backward Compatibility:** 100% compatible with existing Firebase Cloud Firestore profiles, liked music, and 7-day listening history.

            #### 📥 Download & Install:
            Download **`JSABMusic-v3.0.1-release.apk`** below, tap to install, and enjoy unconstrained sovereign music!
          files: |
            dist/JSABMusic-v3.0.1-release.apk
            dist/JSABMusic-v3.0.1-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
