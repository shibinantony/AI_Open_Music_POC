name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v2.2.0-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v2.2.0-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2.0
          name: "JSABMusic v2.2.0 — Sovereign Blue Aesthetic, Playback Controls & Firebase Cloud Sync"
          body: |
            ### 🎵 JSABMusic v2.2.0 — Enjoy the Beauty of Sovereign Music
            **Engineered for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 What's New in v2.2.0:
            - 💙 **Sovereign Blue & Doll Mascot Aesthetics:** Completely detached from legacy JioSaavn styling! Features custom serene doll mascot vector iconography, celestial blue theme (`SovereignBlue`), and the official tagline *"Enjoy the beauty of sovereign music"*.
            - 🔀 **Shuffle All & Play All Engine:** Instant one-tap "Play All" and "Shuffle All" action buttons on Trending, Liked Music, and Recently Listened feeds.
            - 🔁 **Repeat Mode Controls:** Toggle between `Repeat Off`, `Repeat All`, and `Repeat One` directly in the Now Playing sheet and player controller.
            - ☁️ **Firebase & Google Authentication:** Seamless Google Sign-In with Firebase Auth. Automatic anonymous session support ensures instant offline or guest listening with zero forced login walls.
            - ❤️ **Cloud-Synced Liked Music Playlist:** Heart/like any track from the player, mini-player, or list view. Automatically syncs in real-time to Google Cloud Firestore (`users/{uid}/liked_songs`).
            - 🕒 **7-Day Recently Listened History:** Automatic playback tracking with 7-day retention in Firestore (`users/{uid}/history`), letting you browse and replay your recent music journey.
            - 🔄 **Reinstall Session Restoration:** Even after deleting and reinstalling the app, signing into your Google account instantly restores your last played song, queue, and liked songs from Firebase.
            - 🔍 **Bifurcated Search Engine:** Retains 4-tab parallel search (**Songs**, **Albums**, **Artists**, **Playlists**) with instant drill-down streaming.

            #### 📥 Download & Install:
            Download **`JSABMusic-v2.2.0-release.apk`** below, tap to install, and enjoy unconstrained sovereign music!
          files: |
            dist/JSABMusic-v2.2.0-release.apk
            dist/JSABMusic-v2.2.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
