name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v3.0.2-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v3.0.2-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.0.2
          name: "JSABMusic v3.0.2 — Artist & Trending Playback Fixes, Lock Screen Widget, Code Cleanup"
          body: |
            ### 🎵 JSABMusic v3.0.2 — Everything Plays, Everything Works

            **Targeted for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🔧 Bug Fixes in v3.0.2:
            - 🎤 **Artist Top Songs Now Play:** Tapping any artist (from Search or Trending) now correctly resolves and plays their songs. Added automatic name-based fallback when artist IDs are unresolvable.
            - 🎵 **Trending Albums & Playlists Now Play:** Every trending card (Songs, Albums, Artists, Playlists) across all language tabs is now fully functional. No more "nothing happens" on tap.
            - 📱 **Lock Screen Widget Fixed:** Upgraded notification channel to `IMPORTANCE_HIGH` (required by Samsung One UI) and refreshed channel ID so the new setting takes effect. Play/Pause/Next/Prev controls now appear on the lock screen.
            - 🧹 **Major Code Cleanup (−6 source files):** Removed dead/unused `AdBlockEngine`, `WebInterfaceBridge`, `PlaybackStateData`, `LocalMusicStore`, `CookieSyncManager`, `UserAgentManager`, and `BackgroundWebView` files that were never referenced by the active app. Leaner binary, simpler codebase.
            - 📦 **100% Backward Compatible:** Firebase Firestore, liked songs, and session history are fully preserved.

            #### 📥 Download & Install:
            Download **`JSABMusic-v3.0.2-release.apk`** below and install directly.
          files: |
            dist/JSABMusic-v3.0.2-release.apk
            dist/JSABMusic-v3.0.2-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
