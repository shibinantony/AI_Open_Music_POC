name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v2.0.2-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v2.0.2-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.2
          name: "JSABMusic v2.0.2 (Verified 320kbps Akamai CDN & Deep Schema Parser)"
          body: |
            ### 🎵 JSABMusic v2.0.2 — Pure Native Media3 Audio Player for JioSaavn
            **Engineered for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 Enhancements & Fixes in v2.0.2:
            - 🔑 **Verified DES Key Implementation:** Integrated open-source reference key (`38346591`) unlocking pristine 320 kbps uncompressed AAC/MP4 direct streams from Akamai/Cloudflare CDNs (`saavncdn.com`).
            - 📊 **Deep `more_info` Schema Resolution:** Fixed JSON payload extraction to pull `encrypted_media_url`, `primary_artists`, and `duration` from nested API structures.
            - 🛡️ **Zero Startup ANR / Watchdog Hangs:** Completely decoupled foreground service initialization using non-blocking asynchronous binding.
            - 🔊 **Studio Audio HAL Equalizer:** Hardware 5-Band DSP Equalizer and Sub-Bass Boost (+10 dB) attached directly to the native audio session.
            - 🌙 **Screen-Off Background Playback:** Fully compliant with Android 14/15/16 background media standards with lock screen scrubber and Bluetooth controls.

            #### 📥 Download & Install:
            Download **`JSABMusic-v2.0.2-release.apk`** below, tap to install, and enjoy instant, crash-free JioSaavn audio!
          files: |
            dist/JSABMusic-v2.0.2-release.apk
            dist/JSABMusic-v2.0.2-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
