name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v2.1.0-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v2.1.0-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.0
          name: "JSABMusic v2.1.0 — Bifurcated Search (Songs · Albums · Artists · Playlists)"
          body: |
            ### 🎵 JSABMusic v2.1.0 — Bifurcated Search Engine
            **Engineered for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 What's New in v2.1.0:
            - 🔍 **Tabbed Search Results:** Search now bifurcates results into four dedicated tabs — **Songs**, **Albums**, **Artists**, and **Playlists** — eliminating duplicate tracks caused by song-only search.
            - ⚡ **Parallel API Queries:** All four JioSaavn search endpoints (`search.getResults`, `search.getAlbumResults`, `search.getArtistResults`, `search.getPlaylistResults`) fire simultaneously using Kotlin coroutines for instant results.
            - 💿 **Album Drill-Down:** Tapping an album card fetches its full track list (`content.getAlbumDetails`) and queues it for gapless playback.
            - 🎤 **Artist Drill-Down:** Tapping an artist card fetches their top songs (`artist.getArtistPageDetails`) and starts playback.
            - 📋 **Playlist Drill-Down:** Tapping a playlist card fetches all its songs (`playlist.getDetails`) and starts playback.
            - 🔢 **Follower & Track Count Badges:** Albums show track count, Artists show formatted follower count (K/M), Playlists show songs + followers.
            - 🌊 **Trending Screen Unchanged:** Home screen trending songs list is completely unaffected.

            #### Previous Release (v2.0.2) Highlights:
            - 🔑 Verified DES 320 kbps key, deep `more_info` schema, Hardware EQ, Background Playback.

            #### 📥 Download & Install:
            Download **`JSABMusic-v2.1.0-release.apk`** below, tap to install, and enjoy instant, crash-free JioSaavn audio with proper categorized search!
          files: |
            dist/JSABMusic-v2.1.0-release.apk
            dist/JSABMusic-v2.1.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
