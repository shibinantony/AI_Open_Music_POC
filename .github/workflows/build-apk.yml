name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v1.0.2-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v1.0.2-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "JSABMusic v1.0.2 (Black Screen Crash Fix & Acoustic Crossfade)"
          body: |
            ### 🎵 JSABMusic v1.0.2 — AI-Governed Shielded Audio Player for JioSaavn
            **Optimized for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 Crucial Fixes & Architectural Upgrades in v1.0.2:
            - 🛡️ **Permanent Black Screen Crash Fix:** Completely eliminated `.remove()` DOM mutations that broke React's Virtual DOM reconciliation during song transitions. The UI now remains 100% stable across unlimited track changes without ever crashing into a blank screen.
            - 🎚️ **Studio Acoustic Crossfade Engine:** Implemented smooth continuous crossfading between songs (2.5s fade-out + 1.5s fade-in), preventing clicks, pops, or audio drops between consecutive tracks.
            - ⏱️ **Queue Auto-Advance Guard:** Added an intelligent track-transition watchdog that automatically advances to the next track if JioSaavn's player ever stalls on track completion.
            - 🔊 **Resilient 5-Band Equalizer DSP:** Wrapped WebAudio filter nodes in a re-attachable pipeline that stays active and persistent across dynamic track source changes.
            - 📱 **Chromium Renderer Protection:** Added native `onRenderProcessGone` recovery and hardware layer composition to eliminate GPU memory exhaustion.

            #### 📥 Download & Install:
            Download **`JSABMusic-v1.0.2-release.apk`** below, tap to install, and enjoy uninterrupted, crash-free JioSaavn music!
          files: |
            dist/JSABMusic-v1.0.2-release.apk
            dist/JSABMusic-v1.0.2-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
