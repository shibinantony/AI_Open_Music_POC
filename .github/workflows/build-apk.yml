name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v4.1.0-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v4.1.0-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v4.1.0
          name: "JSABMusic v4.1.0 — Live Daily Trends, Instant Search Keyboard & Spotify-Grade UX"
          body: |
            ### 🎵 JSABMusic v4.1.0 — Live Daily Trends, Instant Search Keyboard & Spotify-Grade UX

            **Targeted for Samsung Galaxy S24 FE (Android 14 / 15 / 16 & Samsung One UI 8.5)**

            #### 🐛 Critical Bug Fixes:
            - 🔥 **Live Daily Trends (No More Static Feeds):** Replaced static keyword-search home feeds with JioSaavn's live `webapi.getLaunchData` + `playlist.getDetails` chart endpoints (`India Superhits Top 50` per language), added 4-hour TTL + `onResume()` cache eviction, removed fallback caching on cold-start timeouts, and added a manual Refresh Trends button.
            - ⌨️ **Instant First-Tap Search Keyboard:** Switched `windowSoftInputMode` to `adjustNothing` to eliminate edge-to-edge full-screen relayout stalls on Samsung One UI 8.5, and isolated Search into a dedicated tab with `FocusRequester` + `SoftwareKeyboardController.show()` so the keyboard appears immediately on the first tap.

            #### ✨ Spotify-Grade Design Enhancements:
            - 🧭 **Spotify-Style Bottom Navigation Bar:** Clean 4-tab navigation (`Home`, `Search`, `Liked`, `Recent`) with Sovereign Blue active indicators.
            - 🎧 **Interactive Collection Detail Sheet:** Tapping any Album, Artist, or Playlist opens a rich Spotify-style modal sheet with Play All, Shuffle, Radio, and individual track selection.
            - ⚡ **Home "Jump Back In" Grid & Search "Browse All" Grid:** 2-column quick picks on Home and colorful mood/language category tiles on Search.
            - 📊 **Mini-Player Live Progress Bar:** Floating Spotify-style mini-player with a 2dp live playback progress indicator.

            #### 📥 Download & Install:
            Download **`JSABMusic-v4.1.0-release.apk`** below and install directly.
          files: |
            dist/JSABMusic-v4.1.0-release.apk
            dist/JSABMusic-v4.1.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
