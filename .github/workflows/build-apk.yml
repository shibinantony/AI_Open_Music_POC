name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v3.1.0-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v3.1.0-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.1.0
          name: "JSABMusic v3.1.0 — Radio Mode, Dislike Filter, Dynamic Trending, True Shuffle"
          body: |
            ### 🎵 JSABMusic v3.1.0 — Radio Stations, Dislike Never-Play & Dynamic Trending

            **Targeted for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### ✨ New Features in v3.1.0:
            - 📻 **Endless Radio Mode:** Search for any song, album, artist, or playlist and tap the new **Radio icon** (`WifiTethering`) to launch a continuous queue of ~25 related, mood-matched songs with similar vibes and artists. Also accessible directly from the full Now Playing sheet!
            - 👎 **Dislike / Never-Play Button:** Tap the **Thumbs Down** icon on any song row or in the player sheet to permanently block tracks you never want to hear again. Disliked songs are instantly purged from the active queue and permanently excluded from trending, search, and playback lists.
            - 🌐 **Dynamic Live Trending:** Replaced static fallback locking with dynamic background refresh that pulls daily fresh trending songs, top albums, popular artists, and playlists from JioSaavn. Automatically evicts stale cache on day change.
            - 🔀 **True Uniform Shuffle All:** Fixed the shuffle loop bug where ExoPlayer would repeat a subset of tracks. The queue is now pre-shuffled in uniform random order so every single song plays without repeats.
            - 📦 **100% Backward Compatible:** Firebase Firestore sync for Liked Songs and 7-day history remains fully preserved and compatible with existing cloud databases.

            #### 📥 Download & Install:
            Download **`JSABMusic-v3.1.0-release.apk`** below and install directly.
          files: |
            dist/JSABMusic-v3.1.0-release.apk
            dist/JSABMusic-v3.1.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
