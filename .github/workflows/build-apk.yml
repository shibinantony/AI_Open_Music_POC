name: Build Production Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Optimize & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Rename Output APKs for Direct Download
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist/JSABMusic-v3.0.0-release.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/JSABMusic-v3.0.0-debug.apk \;

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSABMusic-Release-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.0.0
          name: "JSABMusic v3.0.0 — Background Play, Samsung Lockscreen Widget & Multi-Language Hub"
          body: |
            ### 🎵 JSABMusic v3.0.0 — Enjoy the Beauty of Sovereign Music
            **Engineered for Samsung Galaxy S24 FE (Android 16 / One UI 8.5)**

            #### 🚀 What's New in v3.0.0:
            - ⚡ **Continuous Background Playback (Samsung One UI Hardened):** Upgraded `PlaybackService` to a persistent Foreground Service with `START_STICKY`, CPU and Wi-Fi keep-alive locks, network wake mode, and Samsung battery optimization bypass to prevent Samsung's Smart Manager / Phantom Process Killer from stopping playback.
            - 📱 **Lock Screen & AOD Music Player Widget:** System Media Controls with `MediaStyle` notification and `MediaSession` token support. Full lock screen playback widget with Play/Pause, Next Track, Previous Track, track metadata, and real-time high-res album artwork.
            - 🌐 **Multi-Language Explore Hub:** One-tap dynamic language filter chips covering **English**, **Malayalam**, **Tamil**, **Hindi**, **Kannada**, **International**, and **Others**. Features curated Trending Tracks, Top Albums, Popular Artists, and Featured Playlists with instant drill-down streaming!
            - 🔀 **Shuffle All & Play All Engine:** Instant one-tap "Play All" and "Shuffle All" action buttons on Trending, Liked Music, and Recently Listened feeds.
            - 🔁 **Repeat Mode Controls:** Toggle between `Repeat Off`, `Repeat All`, and `Repeat One` directly in the Now Playing sheet and player controller.
            - ☁️ **Full Backward Compatibility:** 100% compatible with existing Firebase Cloud Firestore profiles, liked music, and 7-day history.
            - 🔍 **Bifurcated Search Engine:** 4-tab parallel search (**Songs**, **Albums**, **Artists**, **Playlists**) with instant drill-down streaming.

            #### 📥 Download & Install:
            Download **`JSABMusic-v3.0.0-release.apk`** below, tap to install, and enjoy unconstrained sovereign music!
          files: |
            dist/JSABMusic-v3.0.0-release.apk
            dist/JSABMusic-v3.0.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
